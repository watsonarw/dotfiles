[tasks.set_git_email]
usage = '''
arg <email> help="email address for git commits"
'''
description = "Set git email for this directory (and child directories)"
dir = "{{cwd}}"

run = [
  'mise set --file "mise.local.toml" GIT_AUTHOR_EMAIL="${usage_email?}"',
  'mise set --file "mise.local.toml" GIT_COMMITTER_EMAIL="${usage_email?}"',
]
